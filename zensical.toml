[project]
site_name = "ILG Toolkit"
site_description = "Inverse landscape genetics in JAX"
site_url = "https://vboussange.github.io/ilg-toolkit/"
repo_url = "https://github.com/vboussange/ilg-toolkit"
repo_name = "vboussange/ilg-toolkit"
docs_dir = "docs"
exclude_docs = """
agents/
"""
site_dir = "site"
strict = true
nav = [
  {"Overview" = "index.md"},
  {"Examples" = [
    {"Quickstart" = "examples/quickstart.md"},
    {"Isolation-by-distance model" = "examples/ibd.md"},
    {"MLPE workflow" = "examples/mlpe_workflow.md"},
    {"Ensemble" = "examples/ensemble.md"},
    {"Multispecies (experimental)" = "examples/multispecies.md"},
  ]},
  {"Glossary" = "glossary.md"},
  {"API reference" = [
    {"Inputs and outputs" = "api/data.md"},
    {"Distance models" = "api/models.md"},
    {"Training and calibration" = "api/training.md"},
    {"Prediction" = "api/prediction.md"},
    {"Ensembles" = "api/ensemble.md"},
    {"Persistence" = "api/persistence.md"},
    {"MLPE calibrations" = "api/mlpe.md"},
    {"Isolation-by-distance model" = "api/ibd.md"},
  ]},
]
extra_javascript = ["javascripts/mathjax.js", "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"]

[project.theme]
features = ["content.code.copy", "navigation.sections", "navigation.tracking", "navigation.indexes"]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle = {icon = "lucide/sun", name = "Switch to dark mode"}

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle = {icon = "lucide/moon", name = "Switch to light mode"}

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.highlight" = {anchor_linenums = true}
"pymdownx.inlinehilite" = {}
"pymdownx.arithmatex" = {generic = true}
toc = {permalink = true}

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
inherited_members = true
show_signature_annotations = true
separate_signature = true
filters = ["!^_"]
