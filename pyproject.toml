[project]
name = "ilg-toolkit"
version = "0.1.0"
description = "Reusable inverse landscape genetics training and prediction"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  # Coordax imports coordax.testing at runtime, which imports Chex.
  "chex>=0.1.92,<0.2",
  "coordax>=0.2.8,<0.3",
  "equinox>=0.13.2,<0.14",
  "jax>=0.10.0,<0.11",
  "jaxscape==0.0.10",
  "lineax>=0.1.0,<0.2",
  "numpy>=2.2.6,<3",
  "scipy>=1.15,<2",
  "optax>=0.2.8,<0.3",
]

[project.optional-dependencies]
amg = ["jaxscape[amjax]==0.0.10"]
geo = ["geopandas>=1.1.1,<2", "rasterio>=1.4,<2"]
gpu = ["jax[cuda]>=0.10.0,<0.11; platform_system == 'Linux' and platform_machine == 'x86_64'"]
dev = [
  "build>=1.3,<2",
  "pyright[nodejs]>=1.1.406,<2",
  "pytest>=8.4,<10",
  "ruff>=0.15,<0.16",
  # The installed-package test builds its wheel without network access.
  "setuptools>=81,<82",
]

[build-system]
requires = ["setuptools>=81,<82"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.pyright]
include = ["src", "tests", "experiments", "examples", "benchmarks"]
extraPaths = ["src", "tests"]
pythonVersion = "3.12"
reportIncompatibleMethodOverride = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
