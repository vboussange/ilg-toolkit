[project]
name = "ilg-toolkit"
version = "0.1.0"
description = "Reusable inverse landscape genetics training and prediction"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "equinox>=0.13.2,<0.14",
  "jax>=0.10.0,<0.11",
  "numpy>=2.2.6,<3",
  "optax>=0.2.8,<0.3",
]

[project.optional-dependencies]
geo = ["geopandas>=1.1.1,<2", "rasterio>=1.4,<2"]
gpu = ["jax[cuda]>=0.10.0,<0.11; platform_system == 'Linux' and platform_machine == 'x86_64'"]
dev = ["pytest>=8.4,<10", "ruff>=0.15,<0.16"]

[build-system]
requires = ["setuptools>=81,<82"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
