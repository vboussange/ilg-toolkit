name: Checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install toolkit and declared development dependencies
        run: uv sync --extra dev
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check types
        run: uv run --no-sync pyright
      - name: Test public workflows
        run: uv run --no-sync pytest
      - name: Test experimental Wishart statistics
        run: uv run --no-sync pytest experiments/wishart/test_diagnostic.py
      - name: Run synthetic examples and research reference
        run: |
          for example in examples/*.py; do uv run --no-sync python "$example"; done
          uv run --no-sync python -m experiments.wishart
      - name: Build source distribution and wheel
        run: uv run --no-sync python -m build
      - name: Verify installed wheel outside the source tree
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I - <<'PY'
          import importlib
          import importlib.util
          import pkgutil
          import coordax as cx
          import jax
          import numpy as np
          import ilg_toolkit as ilg
          from ilg_toolkit.models import UNet

          for module in pkgutil.walk_packages(ilg.__path__, ilg.__name__ + "."):
              importlib.import_module(module.name)
          assert "site-packages" in ilg.__file__
          assert importlib.util.find_spec("ilg_toolkit.experimental") is None
          features = np.arange(32, dtype=np.float32).reshape(4, 4, 2) / 32
          region = ilg.RegionBatch(
              "independent", cx.field(features, "row", "column", "feature"),
              ("a", "b"), np.array([[0, 0], [3, 3]]),
          )
          observations = ilg.PairwiseObservations.from_pairs(
              [("a", "b")], [0.3], target=ilg.TargetSpec("synthetic", units="index"),
          )
          state = ilg.fit(
              region, observations,
              distance_model=UNet(
                  2, patch_size=1, base_channels=2, embedding_dim=2, key=jax.random.key(0),
              ),
              config=ilg.TrainingConfig(objective="direct_log1p", steps=0),
          )
          assert np.isfinite(state.model.predict(region).values).all()
          PY
