name: Documentation

on:
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "examples/**"
      - "scripts/build_docs.py"
      - "tests/scripts/**"
      - "README.md"
      - "GLOSSARY.md"
      - "pyproject.toml"
      - "uv.lock"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "examples/**"
      - "scripts/build_docs.py"
      - "tests/scripts/**"
      - "README.md"
      - "GLOSSARY.md"
      - "pyproject.toml"
      - "uv.lock"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra docs --locked
      - name: Test the notebook publication boundary
        run: uv run --no-sync pytest tests/scripts/test_build_docs.py
      - name: Execute every notebook and export Markdown, figures, and downloads
        run: uv run --no-sync python scripts/build_docs.py
      - name: Build the documentation strictly
        run: uv run --no-sync zensical build --strict
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish successful main build
        id: deployment
        uses: actions/deploy-pages@v4
