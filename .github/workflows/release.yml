name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYPI_TOKEN: ${{ secrets.pypi_token }}
    steps:
      # The first PyPI upload is manual; publication starts once `pypi_token` exists.
      - name: Skip publication without a PyPI token
        if: env.PYPI_TOKEN == ''
        run: echo "::notice::Publication skipped until the pypi_token secret exists."

      - name: Release
        if: env.PYPI_TOKEN != ''
        uses: patrick-kidger/action_update_python_project@v8
        with:
            python-version: "3.12"
            # Uninstall and reinstall pytest to work around the fact that it doesn't get put into `bin` otherwise.
            test-script: |
                cp -r ${{ github.workspace }}/tests ./tests
                cp ${{ github.workspace }}/pyproject.toml ./pyproject.toml
                uv pip uninstall pytest
                uv sync --no-install-project --inexact
                uv run --no-sync pytest -n auto
            pypi-token: ${{ secrets.pypi_token }}
            github-user: vboussange
            github-token: ${{ github.token }}
