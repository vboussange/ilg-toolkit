name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check for an existing release
        id: version
        run: python .github/scripts/github-release.py status
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        if: steps.version.outputs.needed == 'true'
        with:
          enable-cache: true
      - name: Select the release source
        if: steps.version.outputs.needed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp .github/scripts/test-release.sh "$RUNNER_TEMP/test-release.sh"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git checkout --detach "$RELEASE_TAG"
          fi
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert version == os.environ['RELEASE_VERSION'], 'Tag and project versions disagree'
          PY
      - name: Verify staged benchmark evidence
        if: steps.version.outputs.needed == 'true'
        run: python .github/scripts/github-release.py verify-evidence
      - name: Build source distribution and wheel
        if: steps.version.outputs.needed == 'true'
        run: uv build --out-dir "$RUNNER_TEMP/release-dist"
      - name: Test the installed source distribution and wheel
        if: steps.version.outputs.needed == 'true'
        run: bash "$RUNNER_TEMP/test-release.sh" "$RUNNER_TEMP/release-dist"
      - name: Tag and publish the GitHub release
        if: steps.version.outputs.needed == 'true'
        run: |
          python .github/scripts/github-release.py publish \
            --distributions "$RUNNER_TEMP/release-dist"
